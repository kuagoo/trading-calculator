<!DOCTYPE html>
<!--
  Trading Risk & Position Calculator
  버전: v4.6 — 해외선물 전용 (원유 / 금 / 구리 / S&P500 / 나스닥100 / 다우 / 러셀2000 / 유로FX / 미국채10년) · 종목별 증거금·수수료 기억 · 수수료 비중 경고
-->
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="리스크계산기">

    <!-- 홈화면 앱 아이콘 -->
    <link rel="apple-touch-icon" href="1.jpg">
    <title>리스크 계산기</title>
    <style>
        :root {
            --bg-color: #F5F2EB;
            --card-bg: #FFFFFF;
            --primary: #1E293B;
            --accent-green: #065F46;
            --accent-burgundy: #800020;
            --accent-navy: #1E3A8A;
            --text-main: #1F2937;
            --text-sub: #6B7280;
            --border: #E5E0D8;
            --input-bg: #FAFAFA;
            --warn-bg: #FEF3C7;
            --warn-border: #F59E0B;
            --danger-bg: #FDECEC;
            --danger-border: #B91C1C;
            --ok-bg: #ECFDF5;
        }

        * {
            box-sizing: border-box;
            -webkit-text-size-adjust: 100%;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 8px;
            padding-top: max(8px, env(safe-area-inset-top));
            padding-bottom: max(8px, env(safe-area-inset-bottom));
        }

        .calculator-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.05);
            margin: auto;
        }

        .title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-icon-box {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .title-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 10px;
            margin-bottom: 8px;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group {
            margin-bottom: 0;
            min-width: 0;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 2px;
        }

        input:not([type=checkbox]) {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text-main);
            font-size: 16px !important;
            font-weight: 600;
            outline: none;
            transition: all 0.15s;
            -webkit-appearance: none;
        }

        .grid-inputs select {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            outline: none;
        }

        input:not([type=checkbox]):focus,
        .grid-inputs select:focus {
            background-color: #FFFFFF;
            border-color: var(--accent-navy);
            box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.1);
        }

        input.input-danger {
            border-color: var(--danger-border);
            background-color: var(--danger-bg);
        }

        /* 채권 32분수 해석 표시 */
        .price-hint {
            display: none;
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--accent-navy);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .price-hint.err {
            color: var(--danger-border);
        }

        .result-box {
            background-color: #FAFAFA;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px dashed var(--border);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .result-value {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .highlight-green {
            color: var(--accent-green);
            font-size: 0.98rem;
        }

        .highlight-navy {
            color: var(--accent-navy);
            font-size: 0.98rem;
        }

        .danger {
            color: var(--accent-burgundy);
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
        }

        .badge-long {
            background: var(--ok-bg);
            color: var(--accent-green);
        }

        .badge-short {
            background: var(--danger-bg);
            color: var(--accent-burgundy);
        }

        .alert-area {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .alert {
            font-size: 0.74rem;
            font-weight: 600;
            line-height: 1.3;
            border-radius: 8px;
            padding: 6px 10px;
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .alert-warn {
            background: var(--warn-bg);
            border: 1px solid var(--warn-border);
            color: #92400E;
        }

        .alert-danger {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: #7F1D1D;
        }

        .alert-ok {
            background: var(--ok-bg);
            border: 1px solid #6EE7B7;
            color: var(--accent-green);
        }

        .reset-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .reset-actions button {
            flex: 1;
            border: 1px solid var(--border);
            background: var(--input-bg);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all .15s;
        }

        .reset-actions button:active {
            background: #E5E7EB;
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="calculator-card" id="card">
        <div class="title">
            <div class="title-icon-box">
                <img src="1.jpg" alt="꾸아구">
            </div>
            해외선물 리스크 & 손익비 계산기
        </div>

        <div class="grid-inputs">
            <div class="input-group">
                <label for="totalCapital">전체 시드 (계좌 원금)</label>
                <input type="text" id="totalCapital" value="" placeholder="예: 70,000" inputmode="decimal"
                    pattern="[0-9.,]*" oninput="formatAndCalculate(this)">
            </div>

            <div class="input-group">
                <label for="riskPercent">1회 허용 리스크 (%)</label>
                <input type="text" id="riskPercent" value="1" inputmode="decimal" pattern="[0-9.,]*"
                    oninput="formatAndCalculate(this)">
            </div>

            <div class="input-group">
                <label for="futFeePerContract">계약당 수수료 (편도·선택)</label>
                <input type="text" id="futFeePerContract" value="" placeholder="예: 2" inputmode="decimal"
                    pattern="[0-9.,]*" oninput="onFeeInput(this)">
            </div>

            <!-- 계약당 증거금 (영웅문 위탁증거금, 선택) — 종목별로 마지막 입력값 기억 -->
            <div class="input-group">
                <label for="futMargin">계약당 증거금 ($·선택)</label>
                <input type="text" id="futMargin" value="" placeholder="예: 850" inputmode="decimal"
                    pattern="[0-9.,]*" oninput="onMarginInput(this)">
            </div>

            <div class="input-group">
                <label for="futProduct">상품 (Product)</label>
                <select id="futProduct" onchange="onProductChange()"></select>
            </div>

            <div class="input-group">
                <label for="futSize">사이즈 (Size)</label>
                <select id="futSize" onchange="onSizeChange()"></select>
            </div>

            <div class="input-group">
                <label for="futPointValue">점가치 (1.0 이동당)</label>
                <input type="text" id="futPointValue" value="" placeholder="자동" inputmode="decimal" pattern="[0-9.,]*"
                    oninput="calculate()">
            </div>

            <div class="input-group">
                <label for="entryPrice">진입 예정가</label>
                <input type="text" id="entryPrice" value="" placeholder="진입 예정가" inputmode="decimal" pattern="[0-9.,]*"
                    oninput="formatAndCalculate(this)">
                <div class="price-hint" id="entryPriceHint"></div>
            </div>

            <div class="input-group">
                <label for="takeProfitPrice">목표가 (Take Profit)</label>
                <input type="text" id="takeProfitPrice" value="" placeholder="목표가" inputmode="decimal"
                    pattern="[0-9.,]*" oninput="formatAndCalculate(this)">
                <div class="price-hint" id="takeProfitPriceHint"></div>
            </div>

            <div class="input-group">
                <label for="stopLossPrice">손절가 (Stop Loss)</label>
                <input type="text" id="stopLossPrice" value="" placeholder="손절가" inputmode="decimal" pattern="[0-9.,]*"
                    oninput="formatAndCalculate(this)">
                <div class="price-hint" id="stopLossPriceHint"></div>
            </div>
        </div>

        <div class="result-box">
            <div class="result-row">
                <span class="result-label">포지션 방향</span>
                <span class="result-value" id="direction">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">계획 손익비 (Risk : Reward)</span>
                <span class="result-value highlight-green" id="rrRatio" style="font-size:1.05rem;">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">기대 수익금 (Take Profit PnL)</span>
                <span class="result-value highlight-green" id="expectedProfit" style="font-size:0.98rem;">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">기대 수익률 (ROI)</span>
                <span class="result-value highlight-navy" id="expectedRoi"
                    style="font-size:0.8rem;white-space:nowrap;">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">실제 허용 손실액 (1회)</span>
                <span class="result-value danger" id="maxLossAmount">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">손절폭 (포인트 · 틱)</span>
                <span class="result-value danger" id="futStopDist">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">계약 수 (Contracts)</span>
                <span class="result-value highlight-green" id="futContracts" style="font-size:1.1rem;">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">계약당 리스크</span>
                <span class="result-value" id="futRiskPerC">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">명목 가치 (Notional)</span>
                <span class="result-value" id="futNotional">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">필요 증거금 (Margin)</span>
                <span class="result-value highlight-navy" id="futMarginTotal">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">수수료 (왕복)</span>
                <span class="result-value danger" id="futFee">—</span>
            </div>
        </div>

        <div class="alert-area" id="alertArea"></div>

        <div class="reset-actions">
            <button type="button" onclick="resetAll()">↺ 초기화</button>
        </div>
    </div>

    <script>
        const MARGIN_WARN_PCT = 50;      // 증거금이 시드의 이 % 이상이면 경고
        const FEE_SHARE_WARN_PCT = 10;   // 왕복 수수료가 리스크의 이 % 이상이면 경고

        let futTick = 0.25;
        let futFrac32 = false;   // 채권(32분수 호가) 모드

        // 상품 정의: [키, 표시명, 사이즈배열]
        // 사이즈배열 항목 → [사이즈키, 라벨, 점가치(1.0 이동당), 틱, 32분수여부]
        const PRODUCTS = [
            ['crude', 'WTI 원유', [
                ['micro', 'MCL (100bbl)', 100, 0.01],
                ['emini', 'QM (500bbl)', 500, 0.025],
                ['standard', 'CL (1,000bbl)', 1000, 0.01]
            ]],
            ['gold', '골드', [
                ['micro', 'MGC (10oz)', 10, 0.10],
                ['standard', 'GC (100oz)', 100, 0.10]
            ]],
            ['copper', '구리', [
                ['micro', 'MHG (2,500lb)', 2500, 0.0005]
            ]],
            ['sp500', 'S&P 500', [
                ['micro', 'MES ($5 × 지수)', 5, 0.25],
                ['emini', 'ES ($50 × 지수)', 50, 0.25]
            ]],
            ['nasdaq', '나스닥 100', [
                ['micro', 'MNQ ($2 × 지수)', 2, 0.25],
                ['emini', 'NQ ($20 × 지수)', 20, 0.25]
            ]],
            ['dow', '다우', [
                ['micro', 'MYM ($0.5 × 지수)', 0.5, 1]
            ]],
            ['russell', '러셀 2000', [
                ['micro', 'M2K ($5 × 지수)', 5, 0.10]
            ]],
            ['euro', '유로 FX', [
                ['standard', '6E (€125,000)', 125000, 0.00005]
            ]],
            ['zn', '미국채 10년 (ZN)', [
                ['standard', 'ZN ($100K 액면)', 1000, 0.015625, true]
            ]],
            ['custom', '기타 / 직접입력', []]
        ];

        const PRICE_FIELDS = [
            ['entryPrice', '진입 예정가'],
            ['stopLossPrice', '손절가'],
            ['takeProfitPrice', '목표가']
        ];

        function buildProductSelect() {
            const sel = document.getElementById('futProduct');
            sel.innerHTML = '';
            PRODUCTS.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p[0];
                opt.textContent = p[1];
                sel.appendChild(opt);
            });
        }

        // 수수료 기본값 (아직 입력한 적 없는 종목만): 키움 온라인 편도 기준 — 마이크로 $2, 일반·미니 $7.5
        const DEFAULT_FEE_MICRO = '2';
        const DEFAULT_FEE_OTHER = '7.5';

        // 계약당 증거금·수수료: 종목·사이즈별로 마지막 입력값을 이 브라우저에 기억 (직접입력은 기억 안 함)
        function memKey(prefix) {
            const p = document.getElementById('futProduct').value;
            const sz = document.getElementById('futSize').value;
            return (p && p !== 'custom' && sz) ? prefix + ':' + p + ':' + sz : null;
        }

        function loadMem(prefix) {
            const k = memKey(prefix);
            if (!k) return null;
            try { return localStorage.getItem(k); } catch (e) { return null; }
        }

        function saveMem(prefix, val) {
            const k = memKey(prefix);
            if (!k) return;
            try {
                if (val) localStorage.setItem(k, val); else localStorage.removeItem(k);
            } catch (e) { /* 저장 불가 환경이면 무시 */ }
        }

        function onMarginInput(el) {
            el.value = parseAndFormatInput(el.value).formatted;
            saveMem('futMargin', el.value);
            calculate();
        }

        function onFeeInput(el) {
            el.value = parseAndFormatInput(el.value).formatted;
            saveMem('futFee', el.value);
            calculate();
        }

        function getSpecs(key) {
            const p = PRODUCTS.find(x => x[0] === key);
            return p ? p[2] : [];
        }

        document.querySelectorAll('.grid-inputs input').forEach(el => {
            el.addEventListener('blur', () => { window.scrollTo(0, 0); document.body.scrollTop = 0; });
        });

        function clearAllResults() {
            ['rrRatio', 'expectedProfit', 'expectedRoi', 'maxLossAmount', 'direction',
                'futStopDist', 'futContracts', 'futRiskPerC', 'futNotional', 'futMarginTotal', 'futFee']
                .forEach(id => { const e = document.getElementById(id); if (e) e.innerText = '—'; });
            document.getElementById('alertArea').innerHTML = '';
        }

        function applyPriceMode() {
            PRICE_FIELDS.forEach(([id, ph]) => {
                document.getElementById(id).placeholder = futFrac32 ? '예: 110.165' : ph;
            });
        }

        function onProductChange() {
            const p = document.getElementById('futProduct').value;
            const sizeSel = document.getElementById('futSize');
            const pvInput = document.getElementById('futPointValue');
            const specs = getSpecs(p);
            sizeSel.innerHTML = '';
            if (specs.length === 0) {
                sizeSel.innerHTML = '<option value="">—</option>';
                sizeSel.disabled = true;
                pvInput.value = '';
                document.getElementById('futMargin').value = '';
                document.getElementById('futFeePerContract').value = '';
                futTick = 0;
                futFrac32 = false;
                applyPriceMode();
                calculate();
                return;
            }
            sizeSel.disabled = false;
            specs.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s[0]; opt.textContent = s[1];
                sizeSel.appendChild(opt);
            });
            sizeSel.selectedIndex = 0;
            onSizeChange();
        }

        function onSizeChange() {
            const p = document.getElementById('futProduct').value;
            const sz = document.getElementById('futSize').value;
            const specs = getSpecs(p);
            const s = specs.find(x => x[0] === sz);
            if (!s) { calculate(); return; }
            document.getElementById('futPointValue').value = parseAndFormatInput(String(s[2])).formatted;
            document.getElementById('futMargin').value = loadMem('futMargin') || '';
            const savedFee = loadMem('futFee');
            document.getElementById('futFeePerContract').value = savedFee !== null ? savedFee : (sz === 'micro' ? DEFAULT_FEE_MICRO : DEFAULT_FEE_OTHER);
            futTick = s[3];
            futFrac32 = !!s[4];
            applyPriceMode();
            calculate();
        }

        function parseAndFormatInput(rawStr) {
            if (rawStr === null || rawStr === undefined) return { formatted: '', numValue: 0 };
            let str = rawStr.toString().trim();
            if (str === '') return { formatted: '', numValue: 0 };
            if (str.endsWith(',')) { str = str.slice(0, -1) + '.'; }
            else if (/^0,[0-9]*/.test(str)) { str = str.replace('0,', '0.'); }
            if (str.includes('.')) {
                const parts = str.split('.');
                const intStr = parts[0].replace(/[^0-9]/g, '');
                const decStr = parts.slice(1).join('').replace(/[^0-9]/g, '');
                let formattedInt = '';
                if (intStr !== '') {
                    const parsedInt = parseInt(intStr, 10);
                    formattedInt = !isNaN(parsedInt) ? parsedInt.toLocaleString() : '0';
                } else { formattedInt = '0'; }
                const formatted = formattedInt + '.' + decStr;
                const numValue = parseFloat((intStr || '0') + '.' + decStr) || 0;
                return { formatted, numValue };
            }
            const digitsOnly = str.replace(/[^0-9]/g, '');
            if (digitsOnly === '') return { formatted: '', numValue: 0 };
            const numValue = parseInt(digitsOnly, 10);
            return { formatted: numValue.toLocaleString(), numValue };
        }

        function parseNum(val) { if (!val) return 0; return parseAndFormatInput(val.toString()).numValue; }

        function formatNum(num, decimals = 0) {
            if (isNaN(num)) return '0';
            const parts = num.toFixed(decimals).split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            return parts.join('.');
        }

        // 채권 32분수 해석
        // 소수점 뒤 앞 두 자리 = 32분의 몇 (00~31), 셋째 자리 5 = ½
        // 110.16 → 110'16 = 110.5  /  110.165 → 110'16.5 = 110.515625
        // 한 자리만 입력하면 십의 자리로 해석 (110.1 → 110'10)
        function parse32(raw) {
            const s = (raw || '').toString().replace(/[,\s]/g, '').trim();
            if (s === '') return { value: 0, valid: true, empty: true };
            const m = s.match(/^(\d+)(?:\.(\d*))?$/);
            if (!m) return { value: 0, valid: false, err: '형식 오류' };
            const whole = parseInt(m[1], 10);
            const fracStr = m[2] || '';
            if (fracStr.length > 3) return { value: 0, valid: false, err: '소수점 뒤 최대 3자리 (예: 110.165)' };
            const f = fracStr.padEnd(3, '0');
            const n32 = parseInt(f.slice(0, 2), 10);
            const sub = f[2];
            if (n32 > 31) return { value: 0, valid: false, err: '32분수는 00~31 (입력 ' + f.slice(0, 2) + ')' };
            if (sub !== '0' && sub !== '5') return { value: 0, valid: false, err: '셋째 자리는 0 또는 5(=½)만' };
            const half = sub === '5';
            const value = whole + (n32 + (half ? 0.5 : 0)) / 32;
            const label = whole + "'" + String(n32).padStart(2, '0') + (half ? '.5' : '');
            return { value, valid: true, label };
        }

        function readPrice(id) {
            const raw = document.getElementById(id).value;
            if (futFrac32) return parse32(raw);
            return { value: parseNum(raw), valid: true, empty: !raw };
        }

        function trimDec(num, decimals) {
            return formatNum(num, decimals).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
        }

        function updatePriceHints(parsed) {
            PRICE_FIELDS.forEach(([id], i) => {
                const input = document.getElementById(id);
                const hint = document.getElementById(id + 'Hint');
                const p = parsed[id];
                input.classList.toggle('input-danger', !p.valid);
                hint.classList.remove('err');
                if (!futFrac32) { hint.style.display = 'none'; hint.textContent = ''; return; }
                hint.style.display = 'block';
                if (!p.valid) {
                    hint.classList.add('err');
                    hint.textContent = '⚠ ' + p.err;
                } else if (p.empty) {
                    hint.textContent = i === 0 ? "110.165 = 110'16.5" : '';
                } else {
                    hint.textContent = '= ' + p.label + ' · ' + trimDec(p.value, 6);
                }
            });
        }

        function formatAndCalculate(inputEl) {
            if (inputEl && inputEl.value !== undefined) {
                inputEl.value = parseAndFormatInput(inputEl.value).formatted;
            }
            calculate();
        }

        function renderAlerts(alerts) {
            const area = document.getElementById('alertArea');
            area.innerHTML = '';
            alerts.forEach(a => {
                const div = document.createElement('div');
                div.className = 'alert alert-' + a.type;
                div.innerHTML = '<span>' + a.icon + '</span><span>' + a.msg + '</span>';
                area.appendChild(div);
            });
        }

        function setDirection(isLong) {
            document.getElementById('direction').innerHTML = isLong
                ? '<span class="badge badge-long">▲ 롱 (Long)</span>'
                : '<span class="badge badge-short">▼ 숏 (Short)</span>';
        }

        function ptDecimals() {
            if (futFrac32) return 4;
            if (!futTick) return 2;
            if (futTick >= 1) return 1;
            if (futTick >= 0.01) return 2;
            if (futTick >= 0.001) return 4;
            return 5;
        }

        function calculate() {
            const account = parseNum(document.getElementById('totalCapital').value);
            const risk = parseNum(document.getElementById('riskPercent').value);
            const pv = parseNum(document.getElementById('futPointValue').value);
            const feePerSide = parseNum(document.getElementById('futFeePerContract').value);
            const marginPerC = parseNum(document.getElementById('futMargin').value);

            const entryP = readPrice('entryPrice');
            const slP = readPrice('stopLossPrice');
            const tpP = readPrice('takeProfitPrice');
            updatePriceHints({ entryPrice: entryP, stopLossPrice: slP, takeProfitPrice: tpP });
            const entry = entryP.value;
            const sl = slP.value;
            const tp = tpP.value;

            const rr = document.getElementById('rrRatio');
            const ep = document.getElementById('expectedProfit');
            const eroi = document.getElementById('expectedRoi');
            const mla = document.getElementById('maxLossAmount');
            const fsd = document.getElementById('futStopDist');
            const fc = document.getElementById('futContracts');
            const frc = document.getElementById('futRiskPerC');
            const fn = document.getElementById('futNotional');
            const ff = document.getElementById('futFee');
            const fm = document.getElementById('futMarginTotal');

            if (!entryP.valid || !slP.valid || !tpP.valid) {
                clearAllResults();
                renderAlerts([{
                    type: 'danger', icon: '🚨',
                    msg: "<b>32분수 입력 오류</b> — 소수점 뒤 앞 두 자리는 00~31, 셋째 자리는 0 또는 5. 예: 110.165 = 110'16.5"
                }]);
                return;
            }

            if (entry <= 0 || sl <= 0 || account <= 0 || pv <= 0) {
                clearAllResults(); return;
            }

            const isLong = sl < entry;
            setDirection(isLong);

            const stopDist = Math.abs(entry - sl);
            if (stopDist === 0) { clearAllResults(); return; }

            const riskDollar = account * (risk / 100);
            const riskPerContract = stopDist * pv;
            const contractsExact = riskDollar / riskPerContract;
            const contracts = Math.floor(contractsExact + 1e-9);   // 부동소수점 오차 보정
            const belowMin = contracts < 1;
            const minRiskPct = (riskPerContract / account) * 100;

            const actualRisk = contracts * riskPerContract;
            const actualRiskPct = (actualRisk / account) * 100;
            const usedPct = riskDollar > 0 ? (actualRisk / riskDollar) * 100 : 0;
            const notional = contracts * pv * entry;
            const totalFee = feePerSide > 0 ? feePerSide * contracts * 2 : 0;
            const feeBreakevenPts = (feePerSide > 0 && pv > 0) ? (2 * feePerSide / pv) : 0;
            const beStr = feeBreakevenPts.toFixed(feeBreakevenPts < 0.01 ? 5 : (feeBreakevenPts < 1 ? 2 : 1));
            const netRisk = actualRisk + totalFee;
            const totalMargin = marginPerC > 0 ? contracts * marginPerC : 0;
            const marginPct = account > 0 ? (totalMargin / account) * 100 : 0;
            const maxContractsByMargin = marginPerC > 0 ? Math.floor(account / marginPerC) : 0;
            const feeSharePct = (totalFee > 0 && actualRisk > 0) ? (totalFee / actualRisk) * 100 : 0;
            const stopTicks = futTick > 0 ? stopDist / futTick : 0;
            const slPct = (stopDist / entry) * 100;

            const d = ptDecimals();

            const frac32Str = futFrac32 ? (+(stopDist * 32).toFixed(1)) + '/32 · ' : '';
            fsd.innerHTML = formatNum(stopDist, d) + ' pt'
                + (stopTicks > 0
                    ? ' <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(' + frac32Str + Math.round(stopTicks) + '틱 · ' + slPct.toFixed(2) + '%)</span>'
                    : ' <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(' + slPct.toFixed(2) + '%)</span>');

            if (belowMin) {
                fc.innerHTML = '<span class="danger">0 계약 (체결 불가)</span>';
                mla.innerText = '—';
                frc.innerText = '$' + formatNum(riskPerContract, 2);
                fn.innerText = '—';
            } else {
                fc.innerHTML = contracts + ' 계약 <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(이론 ' + contractsExact.toFixed(2) + ')</span>';
                mla.innerHTML = totalFee > 0
                    ? '$' + formatNum(netRisk, 2) + ' <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(손실 ' + formatNum(actualRisk, 2) + ' + 수수료 ' + formatNum(totalFee, 2) + ')</span>'
                    : '$' + formatNum(actualRisk, 2) + ' <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(실제 ' + actualRiskPct.toFixed(2) + '% · 예산 $' + formatNum(riskDollar, 2) + ')</span>';
                frc.innerText = '$' + formatNum(riskPerContract, 2);
                fn.innerText = '$' + formatNum(notional, 0);
            }

            if (belowMin) {
                fm.innerText = '—';
            } else if (marginPerC > 0) {
                fm.innerHTML = (totalMargin > account ? '<span class="danger">' : '<span>') + '$' + formatNum(totalMargin, 0) + '</span>'
                    + ' <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(시드의 ' + marginPct.toFixed(1) + '% · $' + formatNum(marginPerC, 0) + ' × ' + contracts + ')</span>';
            } else {
                fm.innerHTML = '<span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(계약당 증거금 입력 시 표시)</span>';
            }

            if (feePerSide > 0 && !belowMin) {
                ff.innerHTML = '-$' + formatNum(totalFee, 2)
                    + ' <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(편도 ' + formatNum(feePerSide, 2) + ' × ' + contracts + ' × 2 · 손익분기 '
                    + beStr + 'pt)</span>';
            } else {
                ff.innerText = feePerSide > 0 ? '—' : '(입력 시 순손익 반영)';
            }

            let isTpValid = false, rrRatio = 0, expectedProfit = 0, netProfit = 0, netRR = 0;
            if (tp > 0) {
                if (isLong && tp > entry) isTpValid = true;
                else if (!isLong && tp < entry) isTpValid = true;

                if (isTpValid) {
                    rrRatio = Math.abs(tp - entry) / stopDist;
                    expectedProfit = contracts * Math.abs(tp - entry) * pv;
                    netProfit = expectedProfit - totalFee;
                    netRR = netRisk > 0 ? netProfit / netRisk : 0;
                    const roiSeed = ((totalFee > 0 ? netProfit : expectedProfit) / account) * 100;
                    rr.innerHTML = totalFee > 0
                        ? '1 : <b>' + netRR.toFixed(2) + '</b> <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(순 · 총 1:' + rrRatio.toFixed(2) + ')</span>'
                        : '1 : <b>' + rrRatio.toFixed(2) + '</b>';
                    if (belowMin) { ep.innerText = '—'; eroi.innerText = '—'; }
                    else {
                        ep.innerHTML = totalFee > 0
                            ? '+$' + formatNum(netProfit, 2) + ' <span style="font-size:0.7rem;color:var(--text-sub);font-weight:600;">(총 +' + formatNum(expectedProfit, 2) + ' · 수수료 -' + formatNum(totalFee, 2) + ')</span>'
                            : '+$' + formatNum(expectedProfit, 2);
                        eroi.innerHTML = '<span class="highlight-green">+' + roiSeed.toFixed(2) + '%</span><span style="font-size:0.64rem;color:var(--text-sub);font-weight:600;"> 시드' + (totalFee > 0 ? ' (순)' : '') + '</span>';
                    }
                } else { rr.innerText = '오류 (TP 방향 부적절)'; ep.innerText = '—'; eroi.innerText = '—'; }
            } else { rr.innerText = '—'; ep.innerText = '—'; eroi.innerText = '—'; }

            const alerts = [];

            if (belowMin) {
                alerts.push({
                    type: 'danger', icon: '🚫',
                    msg: '<b>체결 불가 — 1계약도 못 잡습니다.</b> 손절폭 ' + formatNum(stopDist, d) + 'pt = 계약당 $' + formatNum(riskPerContract, 2) + '인데, 리스크 ' + risk + '% 예산은 $' + formatNum(riskDollar, 2) + ' → <b>' + contractsExact.toFixed(2) + '계약</b>.<br>➡️ <b>해결:</b> ① 리스크를 <b>≈' + minRiskPct.toFixed(2) + '%</b>로 · ② 손절폭이 더 좁은 셋업 · ③ 시드 증액.'
                });
            }

            if (!belowMin && contracts <= 3 && usedPct < 90) {
                alerts.push({
                    type: 'warn', icon: '📉',
                    msg: '<b>계약 수가 적어 리스크 조절이 거칠어요.</b> ' + contracts + '계약 = 실제 ' + actualRiskPct.toFixed(2) + '% (예산의 ' + usedPct.toFixed(0) + '%만 사용). 1계약 차이가 리스크 ' + minRiskPct.toFixed(2) + '%p를 좌우합니다.'
                });
            }

            if (!belowMin && totalMargin > account) {
                alerts.push({
                    type: 'danger', icon: '🚨',
                    msg: '<b>증거금 부족 (체결 불가)!</b> ' + contracts + '계약 × $' + formatNum(marginPerC, 0) + ' = $' + formatNum(totalMargin, 0) + '로 시드를 초과합니다. 증거금으로는 <b>최대 ' + maxContractsByMargin + '계약</b>. 해외선물은 레버리지로 증거금을 줄일 수 없으니 계약 수를 줄이거나 손절폭이 넓은 셋업을 쓰세요.'
                });
            } else if (!belowMin && totalMargin > 0 && marginPct >= MARGIN_WARN_PCT) {
                alerts.push({
                    type: 'warn', icon: '⚠️',
                    msg: '<b>증거금 사용 ' + marginPct.toFixed(0) + '%</b> — 시드의 절반 이상이 묶입니다. 조금만 밀려도 유지증거금 미달(마진콜) 위험이 있고, 다른 포지션을 잡을 여유가 적습니다. (이미 열린 포지션 증거금은 별도)'
                });
            }

            const netRRAlert = isTpValid && totalFee > 0 && !belowMin && netRR < 1.0;
            if (netRRAlert) {
                alerts.push({ type: 'warn', icon: '💸', msg: '<b>수수료 반영 손익비 1:' + netRR.toFixed(2) + '</b> — 왕복 수수료($' + formatNum(totalFee, 2) + ')가 수익을 잠식합니다. 손익분기 ' + beStr + 'pt.' });
            } else if (!belowMin && feeSharePct >= FEE_SHARE_WARN_PCT) {
                alerts.push({
                    type: 'warn', icon: '💸',
                    msg: '<b>수수료가 리스크의 ' + feeSharePct.toFixed(0) + '%</b> — 손절이 좁아 계약 수가 많은 셋업입니다. 실제 손실 $' + formatNum(netRisk, 2) + ' (' + ((netRisk / account) * 100).toFixed(2) + '%)'
                        + (isTpValid ? ', 순 손익비 1:' + netRR.toFixed(2) : '') + '.'
                });
            }

            if (risk > 5) alerts.push({ type: 'danger', icon: '⚠️', msg: '1회 리스크 ' + risk + '% — 과도합니다. 권장 1~3%(최대 5%).' });
            if (tp > 0 && !isTpValid) alerts.push({ type: 'danger', icon: '🚨', msg: '<b>목표가(TP) 방향 오류!</b> ' + (isLong ? '롱 TP는 진입가보다 높아야' : '숏 TP는 진입가보다 낮아야') + ' 합니다.' });

            if (isTpValid) {
                const judgeRR = totalFee > 0 ? netRR : rrRatio;
                const rrTag = totalFee > 0 ? ' · 수수료 반영' : '';
                if (judgeRR < 1.5) alerts.push({ type: 'warn', icon: '⚠️', msg: '<b>손익비 열세 (R:R 1:' + judgeRR.toFixed(2) + rrTag + ')</b> — 1:1.5 미만. 진입 재고.' });
                else if (judgeRR >= 2.0) alerts.push({ type: 'ok', icon: '🎯', msg: '<b>우수한 손익비 (R:R 1:' + judgeRR.toFixed(2) + rrTag + ')</b> — 기대수익이 손실의 ' + judgeRR.toFixed(1) + '배!' });
            }

            if (alerts.length === 0 && !belowMin) {
                alerts.push({ type: 'ok', icon: '✅', msg: contracts + '계약 · 실제 리스크 ' + actualRiskPct.toFixed(2) + '%' + (totalMargin > 0 ? ' · 증거금 ' + marginPct.toFixed(1) + '%' : '') + ' — 안전 범위입니다.' });
            }
            renderAlerts(alerts);

            document.getElementById('stopLossPrice').classList.toggle('input-danger', belowMin);
        }

        function resetAll() {
            ['totalCapital', 'entryPrice', 'stopLossPrice', 'takeProfitPrice', 'futFeePerContract']
                .forEach(id => document.getElementById(id).value = '');
            document.getElementById('riskPercent').value = '1';
            document.getElementById('futProduct').selectedIndex = 0;
            onProductChange();
            clearAllResults();
        }

        buildProductSelect();
        onProductChange();
    </script>

</body>
